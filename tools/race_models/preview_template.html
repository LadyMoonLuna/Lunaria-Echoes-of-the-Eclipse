<title>Raças de Lunaria 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: palco 3D à esquerda (eclipse ao fundo), grimório lateral com raças e lore à direita; empilha no celular. */
  :root {
    --night: #0b0a14;
    --night-2: #13111f;
    --panel: #171427;
    --line: #2c2742;
    --moon: #e8e4f4;
    --mist: #a49fbd;
    --dim: #6e6889;
    --accent: #ffd54f;
    --display: "Marcellus", "Palatino Linotype", Georgia, serif;
    --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--moon);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
  }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    height: 100%;
    min-height: 560px;
  }
  .stage { position: relative; min-width: 0; overflow: hidden; background: radial-gradient(120% 90% at 50% 15%, #1d1934 0%, var(--night) 60%); }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .stage-head {
    position: absolute; inset: 0 0 auto 0;
    padding-block: 18px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: 20px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .race-id { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; }
  .race-name { font-family: var(--display); font-size: clamp(28px, 4vw, 46px); line-height: 1.05; margin: 4px 0 2px; text-wrap: balance; }
  .race-title { color: var(--mist); font-size: 15px; }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 16px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .chip {
    font: 500 13px var(--body);
    color: var(--moon);
    background: rgba(23, 20, 39, 0.82);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .chip:focus-visible, .race:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--dim); font-size: 12px; margin-left: auto; }
  .status[hidden] { display: none; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mist); font-family: var(--mono); font-size: 13px; text-align: center; padding: 24px; }

  aside {
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
  }
  .aside-inner {
    overflow-y: auto;
    padding-block: 20px 24px;
    padding-left: 20px;
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 20px;
  }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .races { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .race {
    display: flex; align-items: center; gap: 8px;
    text-align: left;
    background: var(--night-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--moon);
    padding: 8px 10px;
    font: 500 14px var(--body);
    cursor: pointer;
    min-width: 0;
  }
  .race span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .race .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  .race .num { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-left: auto; font-variant-numeric: tabular-nums; }
  .race[aria-current="true"] { border-color: var(--accent); background: #211c38; }
  .lore { font-size: 15.5px; color: var(--moon); max-width: 62ch; }
  .lore::first-letter { font-family: var(--display); font-size: 2.3em; float: left; line-height: 0.9; padding: 4px 6px 0 0; color: var(--accent); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fact { border-top: 1px solid var(--line); padding-top: 6px; }
  .fact b { display: block; font-family: var(--mono); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fact small { color: var(--dim); font-size: 12px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .swatch { width: 22px; height: 22px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.12); }
  pre {
    margin: 8px 0 0; padding: 10px 12px;
    background: var(--night); border: 1px solid var(--line); border-radius: 6px;
    font: 12px/1.6 var(--mono); color: var(--mist);
    overflow-x: auto;
  }
  pre .k { color: var(--accent); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 62vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .aside-inner { overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .chip { transition: none; } }
</style>

<div class="app">
  <section class="stage" id="stage">
    <div class="stage-head">
      <div>
        <div class="race-id" id="raceId">Raça #19</div>
        <h1 class="race-name" id="raceName">Sylvari</h1>
        <div class="race-title" id="raceTitle"></div>
      </div>
    </div>
    <div class="status" id="status">Carregando o palco 3D…</div>
    <div class="controls">
      <button class="chip" id="btnSpin" aria-pressed="true">Girar</button>
      <button class="chip" id="btnWalk" aria-pressed="false">Andar</button>
      <button class="chip" id="btnLineup" aria-pressed="false">Desfile das 10 raças</button>
      <span class="hint">Arraste para orbitar · role para aproximar</span>
    </div>
  </section>

  <aside>
    <div class="aside-inner">
      <div>
        <div class="eyebrow">Raças lendárias · IDs 19–28</div>
        <div class="races" id="raceList"></div>
      </div>
      <div>
        <div class="eyebrow">Crônica</div>
        <p class="lore" id="lore"></p>
      </div>
      <div class="facts">
        <div class="fact"><b id="fParts">0</b><small>primitivas</small></div>
        <div class="fact"><b id="fGroups">0</b><small>pivôs animados</small></div>
        <div class="fact"><b id="fScale">1.00</b><small>escala</small></div>
      </div>
      <div>
        <div class="eyebrow">Paleta de materiais</div>
        <div class="swatches" id="swatches"></div>
      </div>
      <div>
        <div class="eyebrow">No Godot</div>
        <pre id="snippet"></pre>
      </div>
    </div>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const MODELS = /*__RACE_DATA__*/null;
const WALK_GROUPS = { leg_r: 1, leg_l: -1, arm_r: -0.8, arm_l: 0.8 };
const DEG = Math.PI / 180;

// ---------- Construção de modelo (espelha client/scripts/models/RaceModel.gd) ----------
const geoCache = new Map();
function prismGeometry(w, h, d) {
  const x = w / 2, y = h / 2, z = d / 2;
  const A = [-x, -y], B = [x, -y], C = [0, y];
  const v = [];
  const tri = (p, q, r) => v.push(...p, ...q, ...r);
  tri([...A, z], [...B, z], [...C, z]);
  tri([...A, -z], [...C, -z], [...B, -z]);
  const quad = (P, Q) => { tri([...P, z], [...P, -z], [...Q, -z]); tri([...P, z], [...Q, -z], [...Q, z]); };
  quad(A, C); quad(C, B); quad(B, A);
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}
function geometry(shape, s) {
  const key = shape + ":" + s.join(",");
  if (geoCache.has(key)) return geoCache.get(key);
  let g;
  switch (shape) {
    case "box": g = new THREE.BoxGeometry(s[0], s[1], s[2]); break;
    case "sphere": g = new THREE.SphereGeometry(s[0], 18, 12); break;
    case "cylinder": g = new THREE.CylinderGeometry(s[0], s[1], s[2], 14); break;
    case "capsule": g = new THREE.CapsuleGeometry(s[0], Math.max(0.0001, s[1] - 2 * s[0]), 5, 14); break;
    case "torus": g = new THREE.TorusGeometry((s[0] + s[1]) / 2, (s[1] - s[0]) / 2, 8, 24); g.rotateX(Math.PI / 2); break;
    case "prism": g = prismGeometry(s[0], s[1], s[2]); break;
    default: g = new THREE.BoxGeometry(0.05, 0.05, 0.05);
  }
  geoCache.set(key, g);
  return g;
}

function makeMaterial(m) {
  const alpha = m.alpha ?? 1;
  let mat;
  if (m.unshaded) {
    mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(m.emit || m.color) });
  } else {
    mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(m.color), roughness: m.rough, metalness: m.metal,
    });
    if (m.emit) { mat.emissive = new THREE.Color(m.emit); mat.emissiveIntensity = m.energy; }
  }
  if (alpha < 1) { mat.transparent = true; mat.opacity = alpha; mat.depthWrite = false; }
  if (m.double) mat.side = THREE.DoubleSide;
  mat.userData = { spec: m, baseEnergy: m.energy ?? 0, baseAlpha: alpha };
  return mat;
}

function buildModel(def) {
  const root = new THREE.Group();
  root.scale.setScalar(def.scale || 1);
  const mats = {};
  for (const [k, m] of Object.entries(def.materials)) mats[k] = makeMaterial(m);
  const groups = {}, pivots = {}, animated = [], walkers = [];
  for (const g of def.groups) {
    const node = new THREE.Group();
    const parentPivot = g.parent ? pivots[g.parent] : [0, 0, 0];
    node.position.set(g.pivot[0] - parentPivot[0], g.pivot[1] - parentPivot[1], g.pivot[2] - parentPivot[2]);
    (g.parent ? groups[g.parent] : root).add(node);
    groups[g.name] = node; pivots[g.name] = g.pivot;
    if (g.anim) animated.push({ node, anim: g.anim, base: node.position.clone() });
    if (g.name in WALK_GROUPS) walkers.push({ node, sign: WALK_GROUPS[g.name] });
  }
  for (const p of def.parts) {
    const mesh = new THREE.Mesh(geometry(p.shape, p.size), mats[p.mat]);
    const gp = p.group ? pivots[p.group] : [0, 0, 0];
    mesh.position.set(p.pos[0] - gp[0], p.pos[1] - gp[1], p.pos[2] - gp[2]);
    mesh.rotation.order = "YXZ";
    if (p.rot) mesh.rotation.set(p.rot[0] * DEG, p.rot[1] * DEG, p.rot[2] * DEG);
    if (p.scale) mesh.scale.set(p.scale[0], p.scale[1], p.scale[2]);
    mesh.castShadow = !mats[p.mat].transparent;
    (p.group ? groups[p.group] : root).add(mesh);
  }
  for (const l of def.lights) {
    const light = new THREE.PointLight(new THREE.Color(l.color), l.energy * 0.6, l.range * 1.3, 2);
    light.position.set(...l.pos);
    root.add(light);
  }
  const animMats = Object.values(mats).filter((m) => m.userData.spec.anim);
  const q = new THREE.Quaternion(), axis = new THREE.Vector3();

  function update(t, walk) {
    for (const a of animated) {
      const an = a.anim, ph = an.phase || 0;
      if (an.type === "spin" || an.type === "sway") {
        axis.set(...an.axis).normalize();
        const ang = an.type === "spin" ? an.speed * t * DEG : an.amp * DEG * Math.sin(an.speed * t + ph);
        a.node.quaternion.copy(q.setFromAxisAngle(axis, ang));
      } else if (an.type === "bob") {
        a.node.position.y = a.base.y + an.amp * Math.sin(an.speed * t + ph);
      } else if (an.type === "pulse") {
        a.node.scale.setScalar(1 + an.amp * Math.sin(an.speed * t + ph));
      }
    }
    const swing = walk * 32 * DEG * Math.sin(t * 7);
    for (const w of walkers) w.node.rotation.x = swing * w.sign;
    for (const m of animMats) {
      const an = m.userData.spec.anim;
      if (an.type === "glow") {
        const k = an.min + (an.max - an.min) * (0.5 + 0.5 * Math.sin(an.speed * t));
        if (m.emissive) m.emissiveIntensity = m.userData.baseEnergy * k;
      } else if (an.type === "flicker") {
        const n = 0.5 + 0.5 * Math.sin(an.speed * t) * Math.sin(an.speed * 1.73 * t + 1.3);
        m.opacity = m.userData.baseAlpha * (an.min + (an.max - an.min) * n);
      }
    }
  }
  return { root, update, def };
}

// ---------- Cena ----------
const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  statusEl.textContent = "Este navegador não conseguiu iniciar o WebGL, então o palco 3D não pode ser exibido.";
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0a14, 9, 26);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.53;

scene.add(new THREE.HemisphereLight(0xa9a5dc, 0x2a2232, 1.7));
const moon = new THREE.DirectionalLight(0xdcd8ff, 1.6);
moon.position.set(-3, 6, -4);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9 });
scene.add(moon);
const rim = new THREE.DirectionalLight(0x9f7bff, 1.2);
rim.position.set(3, 3, 5);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xfff1e0, 1.1);
fill.position.set(1.5, 3, -6);
scene.add(fill);

// Chão: pedra lunar com círculo rúnico
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0x15131f, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const runeMat = new THREE.MeshBasicMaterial({ color: 0xffd54f, transparent: true, opacity: 0.35 });
const rune = new THREE.Mesh(new THREE.RingGeometry(0.95, 1.0, 72), runeMat);
rune.rotation.x = -Math.PI / 2; rune.position.y = 0.005;
scene.add(rune);
const rune2 = new THREE.Mesh(new THREE.RingGeometry(1.12, 1.135, 72), runeMat);
rune2.rotation.x = -Math.PI / 2; rune2.position.y = 0.005;
scene.add(rune2);

// Eclipse ao fundo
const eclipse = new THREE.Group();
eclipse.add(new THREE.Mesh(new THREE.RingGeometry(2.0, 2.35, 96), new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: 0.75, fog: false })));
eclipse.add(new THREE.Mesh(new THREE.CircleGeometry(2.0, 96), new THREE.MeshBasicMaterial({ color: 0x07060d, fog: false })));
eclipse.position.set(0, 6.5, 16);
scene.add(eclipse);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.42, 0.4, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- Estado e UI ----------
const built = MODELS.map(buildModel);
const byKey = Object.fromEntries(built.map((b, i) => [b.def.key, i]));
let current = 0, spin = true, walk = false, lineup = false;
let walkAmount = 0;
const holder = new THREE.Group();
scene.add(holder);

const list = document.getElementById("raceList");
built.forEach((b, i) => {
  const btn = document.createElement("button");
  btn.className = "race";
  btn.id = "race-" + b.def.key;
  btn.innerHTML = `<span class="dot" style="background:${b.def.color};color:${b.def.color}"></span><span class="n">${b.def.name}</span><span class="num">${b.def.id}</span>`;
  btn.addEventListener("click", () => select(i, true));
  list.appendChild(btn);
});

function layout() {
  holder.clear();
  if (lineup) {
    const n = built.length, gap = 1.55;
    built.forEach((b, i) => {
      b.root.position.set((i - (n - 1) / 2) * gap, 0, i === current ? -0.4 : 0);
      b.root.rotation.y = Math.PI;
      holder.add(b.root);
    });
    rune.visible = rune2.visible = false;
    controls.target.set(0, 1.0, 0);
    camera.position.set(0, 2.6, -11.5);
  } else {
    const b = built[current];
    b.root.position.set(0, 0, 0);
    holder.add(b.root);
    rune.visible = rune2.visible = true;
    controls.target.set(0, 1.05, 0);
    camera.position.set(1.4, 1.75, -3.9);
  }
  controls.update();
}

function select(i, fromClick) {
  current = i;
  const d = built[i].def;
  document.documentElement.style.setProperty("--accent", d.color === "#006064" ? "#26c6da" : d.color === "#c62828" ? "#ff5f52" : d.color);
  runeMat.color.set(d.color === "#006064" ? "#26c6da" : d.color);
  document.getElementById("raceId").textContent = `Raça #${d.id} · ${d.key}`;
  document.getElementById("raceName").textContent = d.name;
  document.getElementById("raceTitle").textContent = d.title;
  document.getElementById("lore").textContent = d.lore;
  document.getElementById("fParts").textContent = d.parts.length;
  document.getElementById("fGroups").textContent = d.groups.length;
  document.getElementById("fScale").textContent = d.scale.toFixed(2);
  const sw = document.getElementById("swatches");
  sw.innerHTML = "";
  for (const [k, m] of Object.entries(d.materials)) {
    const s = document.createElement("span");
    s.className = "swatch";
    s.title = k;
    s.style.background = m.emit ? `radial-gradient(circle, ${m.emit} 0%, ${m.color} 70%)` : m.color;
    sw.appendChild(s);
  }
  document.getElementById("snippet").innerHTML =
    `<span class="k">const</span> RaceModel = preload("res://scripts/models/RaceModel.gd")\n` +
    `<span class="k">var</span> modelo = RaceModel.create(${d.id})  <span style="color:var(--dim)"># ${d.name}</span>\n` +
    `add_child(modelo)\nmodelo.set_move_speed(velocity.length())`;
  list.querySelectorAll(".race").forEach((el, j) => el.setAttribute("aria-current", j === i ? "true" : "false"));
  if (fromClick) { try { history.replaceState(null, "", "#" + d.key); } catch (e) {} }
  layout();
}

function toggle(btn, val) { btn.setAttribute("aria-pressed", val ? "true" : "false"); }
const btnSpin = document.getElementById("btnSpin"), btnWalk = document.getElementById("btnWalk"), btnLineup = document.getElementById("btnLineup");
btnSpin.addEventListener("click", () => { spin = !spin; toggle(btnSpin, spin); });
btnWalk.addEventListener("click", () => { walk = !walk; toggle(btnWalk, walk); });
btnLineup.addEventListener("click", () => { lineup = !lineup; toggle(btnLineup, lineup); layout(); });

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduceMotion) { spin = false; toggle(btnSpin, false); }

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

const start = byKey[(location.hash || "").slice(1)];
select(start ?? 0, false);
window.addEventListener("hashchange", () => {
  const i = byKey[(location.hash || "").slice(1)];
  if (i !== undefined && i !== current) select(i, false);
});
statusEl.hidden = true;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  walkAmount += ((walk ? 1 : 0) - walkAmount) * Math.min(1, dt * 6);
  if (spin && !lineup) built[current].root.rotation.y += dt * 0.45;
  if (lineup) built.forEach((b) => b.update(t, walkAmount));
  else built[current].update(t, walkAmount);
  rune.rotation.z += dt * 0.15;
  controls.update();
  composer.render();
});
window.__lunariaReady = true;
</script>
